[package]
name = "rdf-structural-model"
version = "0.2.3"
description = "Owned and borrowed RDF 1.2 structural values with typed extensions and format-neutral Serde"
authors = ["Jacobus Geluk <jacobus.geluk@dataroad.com>"]
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/legra-ai/rdf-structural-model"
readme = "README.md"
build = "build.rs"
keywords = ["rdf", "rdf12", "serde", "semantic-web"]
categories = ["data-structures", "encoding"]
include = ["Cargo.toml", "README.md", "LICENSE-APACHE", "LICENSE-MIT", "build.rs", "src/**/*.rs", "tests/**/*.rs"]

[dependencies]
borrow-or-share = "0.2"
iri-rfc3987 = "=0.1.8"
langtag = "1.1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
serde_json = "1"

[build-dependencies]
rhusky = "2.0.1"

[lints.rust]
missing_docs = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
